services:
  invoiceplane_app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
        IP_VERSION: ${IP_VERSION}
        IP_SOURCE: ${IP_SOURCE}
    image: ${IP_IMAGE}:${IP_VERSION}
    container_name: ${IP_CONTAINER_NAME}
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-if_not_present}
    env_file:
      - .env
    environment:
      TZ: ${TZ}

      IP_URL: ${IP_URL}
      IP_LANGUAGE: ${IP_LANGUAGE}
      ENABLE_DEBUG: ${ENABLE_DEBUG}
      DISABLE_SETUP: ${DISABLE_SETUP}
      REMOVE_INDEXPHP: ${REMOVE_INDEXPHP}
      SETUP_COMPLETED: ${SETUP_COMPLETED}

      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PORT: ${MYSQL_PORT}

      SESS_EXPIRATION: ${SESS_EXPIRATION}
      SESS_MATCH_IP: ${SESS_MATCH_IP}
      ENABLE_INVOICE_DELETION: ${ENABLE_INVOICE_DELETION}
      DISABLE_READ_ONLY: ${DISABLE_READ_ONLY}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_CIPHER: ${ENCRYPTION_CIPHER}

      PUID: ${PUID}
      PGID: ${PGID}
      HOST_OS: ${HOST_OS}
    ports:
      - "${IP_PORT}:80"
    volumes:
      - ./invoiceplane_uploads:/var/www/html/uploads
      - ./invoiceplane_css:/var/www/html/assets/core/css
      - ./invoiceplane_views:/var/www/html/application/views
      - ./invoiceplane_language:/var/www/html/application/language/${IP_LANGUAGE}
      - ./data/logs:/var/www/html/application/logs
      - ./data/finalize:/state
      - ./invoiceplane_helpers/mpdf_helper.php:/var/www/html/application/helpers/mpdf_helper.php

    depends_on:
      invoiceplane_db:
        condition: service_healthy

  invoiceplane_db:
    image: mariadb:${MYSQL_VERSION}
    container_name: ${MYSQL_CONTAINER_NAME}
    hostname: ${MYSQL_HOST}
    restart: unless-stopped
    user: "${MYSQL_UID}:${MYSQL_GID}"
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - sh
      - -c
      - >
        exec docker-entrypoint.sh mariadbd
        --character-set-server=utf8mb4
        --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mariadb:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        aliases:
          - ${MYSQL_HOST}

  invoiceplane_finalizer:
    build:
      context: .
      dockerfile: docker/finalizer/Dockerfile
    container_name: ${IP_CONTAINER_NAME}_finalizer
    restart: unless-stopped
    working_dir: ${HOST_WORKSPACE}
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      IP_CONTAINER_NAME: ${IP_CONTAINER_NAME}
      WORKSPACE: ${HOST_WORKSPACE}
      STATE_DIR: /state
      COMPOSE_PROJECT_DIR: ${HOST_WORKSPACE}
      COMPOSE_FILE: ${HOST_WORKSPACE}/docker-compose.yml
      COMPOSE_SERVICE: invoiceplane_app
      APP_URL: http://invoiceplane_app/
      READINESS_URL: http://invoiceplane_app/sessions/login
    volumes:
      - ${HOST_WORKSPACE}:${HOST_WORKSPACE}
      - ./data/finalize:/state
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - invoiceplane_app



